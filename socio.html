<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sócio Digital — Números</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#f1f5f9;min-height:100vh}

  /* LOGIN */
  #loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .login-box{background:#1e293b;border-radius:20px;padding:32px 24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
  .login-logo{text-align:center;font-size:48px;margin-bottom:8px}
  .login-title{text-align:center;font-size:22px;font-weight:700;color:#f1f5f9;margin-bottom:4px}
  .login-sub{text-align:center;font-size:14px;color:#94a3b8;margin-bottom:28px}
  .login-input{width:100%;background:#0f172a;border:1.5px solid #334155;border-radius:12px;padding:14px 16px;font-size:16px;color:#f1f5f9;outline:none;margin-bottom:12px;-webkit-appearance:none}
  .login-input:focus{border-color:#6366f1}
  .btn-login{width:100%;background:#6366f1;color:#fff;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .15s}
  .btn-login:active{opacity:.8}
  .login-erro{color:#f87171;font-size:13px;text-align:center;margin-top:8px;min-height:18px}

  /* APP */
  #app{display:none;min-height:100vh}
  .header{background:#1e293b;padding:16px 20px;position:sticky;top:0;z-index:10;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between}
  .header-title{font-size:18px;font-weight:700;color:#f1f5f9}
  .header-badge{background:#6366f1;color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
  .btn-sair{background:none;border:none;color:#94a3b8;font-size:13px;cursor:pointer;padding:6px 10px;border-radius:8px}

  .content{padding:16px}

  /* KPI CARDS */
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .kpi-card{background:#1e293b;border-radius:14px;padding:16px 14px}
  .kpi-label{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:6px}
  .kpi-value{font-size:22px;font-weight:800;color:#f1f5f9;line-height:1}
  .kpi-card.verde .kpi-value{color:#22c55e}
  .kpi-card.amarelo .kpi-value{color:#fbbf24}
  .kpi-card.roxo .kpi-value{color:#a78bfa}
  .kpi-full{grid-column:1/-1}

  /* PERIODO */
  .periodo-bar{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
  .periodo-bar::-webkit-scrollbar{display:none}
  .btn-periodo{background:#1e293b;border:1.5px solid #334155;border-radius:8px;color:#94a3b8;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .btn-periodo.ativo{background:#6366f1;border-color:#6366f1;color:#fff}

  /* LISTA */
  .section-title{font-size:13px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
  .envio-item{background:#1e293b;border-radius:12px;padding:14px;margin-bottom:8px;border-left:3px solid #6366f1}
  .envio-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
  .envio-cliente{font-size:16px;font-weight:700;color:#f1f5f9}
  .envio-valor{font-size:16px;font-weight:800;color:#22c55e}
  .envio-data{font-size:12px;color:#64748b;margin-bottom:5px}
  .envio-status{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px}
  .envio-status.pago{background:#22c55e22;color:#22c55e}
  .envio-status.pendente{background:#fbbf2422;color:#fbbf24}
  .envio-status.parcial{background:#fb923c22;color:#fb923c}
  .envio-prods{font-size:12px;color:#94a3b8;margin-top:5px}

  .empty-state{text-align:center;padding:40px 20px;color:#64748b}
  .empty-state .icon{font-size:40px;margin-bottom:8px}
  .loading{text-align:center;padding:32px;color:#64748b;font-size:14px}
  .realtime-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:5px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .realtime-label{font-size:11px;color:#22c55e;font-weight:600;display:flex;align-items:center}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">📊</div>
    <div class="login-title">Sócio Digital</div>
    <div class="login-sub">Acesso restrito — apenas digital</div>
    <input class="login-input" type="password" id="senhaInput" placeholder="Senha" autocomplete="current-password">
    <button class="btn-login" onclick="fazerLogin()">Entrar</button>
    <div class="login-erro" id="loginErro"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="header">
    <div>
      <div class="header-title">🌐 Canal Digital</div>
      <div class="realtime-label" style="margin-top:3px"><span class="realtime-dot"></span> Tempo real</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <button class="btn-sair" onclick="sair()">Sair</button>
    </div>
  </div>

  <div class="content">
    <div class="kpi-grid" id="kpiGrid">
      <div class="loading" style="grid-column:1/-1">Carregando...</div>
    </div>

    <div class="periodo-bar">
      <button class="btn-periodo ativo" onclick="setPeriodo('mes')" id="pMes">Este mês</button>
      <button class="btn-periodo" onclick="setPeriodo('mesant')" id="pMesAnt">Mês anterior</button>
      <button class="btn-periodo" onclick="setPeriodo('ano')" id="pAno">Este ano</button>
      <button class="btn-periodo" onclick="setPeriodo('tudo')" id="pTudo">Tudo</button>
    </div>

    <div class="section-title">📋 Envios</div>
    <div id="listaEnvios"><div class="loading">Carregando...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ==============================
// CONFIG — altere a senha aqui!
// ==============================
const SENHA_SOCIO = 'socio2024';

const SUPA_URL = 'https://dtmfyupeotctxhjhtmbv.supabase.co';
const SUPA_KEY = 'sb_publishable_RyyKNsnIKJNGa6OQ_Z9Yiw_9Bc_uf-r';
// ==============================

const { createClient } = supabase;
let sb;
let periodo = 'mes';
let todosEnvios = [];

function fazerLogin(){
  const v = document.getElementById('senhaInput').value;
  if(v === SENHA_SOCIO){
    sessionStorage.setItem('socio_ok','1');
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
    iniciarApp();
  } else {
    document.getElementById('loginErro').textContent = 'Senha incorreta.';
    document.getElementById('senhaInput').value='';
  }
}

document.getElementById('senhaInput').addEventListener('keydown', e => { if(e.key==='Enter') fazerLogin(); });

function sair(){
  sessionStorage.removeItem('socio_ok');
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('app').style.display='none';
}

async function iniciarApp(){
  sb = createClient(SUPA_URL, SUPA_KEY);
  await carregarDados();

  // Realtime — escuta mudanças
  sb.channel('envios-socio')
    .on('postgres_changes', {event:'*', schema:'public', table:'envios_sync'}, ()=>{ carregarDados(); })
    .subscribe();
}

async function carregarDados(){
  try{
    const { data, error } = await sb
      .from('envios_sync')
      .select('*')
      .eq('canal','digital')
      .order('data_entrega', {ascending:false, nullsLast:true});
    if(error) throw error;
    todosEnvios = data || [];
    renderizar();
  } catch(err){
    document.getElementById('kpiGrid').innerHTML = `<div style="grid-column:1/-1;color:#f87171;text-align:center;padding:20px">Erro: ${err.message}</div>`;
  }
}

function periodoRange(){
  const now = new Date();
  const ano = now.getFullYear();
  const mes = now.getMonth();
  const pad = n=>String(n).padStart(2,'0');
  const fimMes = new Date(ano, mes+1, 0).getDate();
  const fimMesAntDia = new Date(ano, mes, 0).getDate();
  const mesAnt = mes===0?12:mes;
  const anoAnt = mes===0?ano-1:ano;
  switch(periodo){
    case 'mes':    return { ini:`${ano}-${pad(mes+1)}-01`, fim:`${ano}-${pad(mes+1)}-${fimMes}` };
    case 'mesant': return { ini:`${anoAnt}-${pad(mesAnt)}-01`, fim:`${anoAnt}-${pad(mesAnt)}-${fimMesAntDia}` };
    case 'ano':    return { ini:`${ano}-01-01`, fim:`${ano}-12-31` };
    default:       return { ini:'', fim:'' };
  }
}

function brl(v){ return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2}); }

function renderizar(){
  const range = periodoRange();
  const filtrado = todosEnvios.filter(e=>{
    if(!range.ini && !range.fim) return true;
    const d = e.data_entrega||'';
    if(range.ini && d < range.ini) return false;
    if(range.fim && d > range.fim) return false;
    return true;
  });

  // KPIs sobre TUDO (período atual)
  const totalGeral = todosEnvios.reduce((s,e)=>s+Number(e.total||0),0);
  const recebido = filtrado.filter(e=>e.status_pagamento==='pago').reduce((s,e)=>s+Number(e.total||0),0);
  const aReceber = filtrado.filter(e=>e.status_pagamento!=='pago').reduce((s,e)=>s+Number(e.total||0),0);
  const qEnvios  = filtrado.length;

  document.getElementById('kpiGrid').innerHTML = `
    <div class="kpi-card verde"><div class="kpi-label">✅ Recebido</div><div class="kpi-value">${brl(recebido)}</div></div>
    <div class="kpi-card amarelo"><div class="kpi-label">⏳ A receber</div><div class="kpi-value">${brl(aReceber)}</div></div>
    <div class="kpi-card roxo kpi-full"><div class="kpi-label">📦 Total digital no período · ${qEnvios} envios</div><div class="kpi-value">${brl(recebido+aReceber)}</div></div>
  `;

  // Lista
  const el = document.getElementById('listaEnvios');
  if(!filtrado.length){
    el.innerHTML='<div class="empty-state"><div class="icon">📭</div>Nenhum envio neste período</div>';
    return;
  }
  el.innerHTML = filtrado.map(e=>{
    const dataFmt = e.data_entrega ? new Date(e.data_entrega+'T00:00:00').toLocaleDateString('pt-BR') : '—';
    const prods = Array.isArray(e.produtos) ? e.produtos.map(p=>`${p.produto||''} (${p.quantidade||''})`).join(', ') : '—';
    const st = e.status_pagamento||'pendente';
    const stLabel = st==='pago'?'✓ Pago':st==='parcial'?'◑ Parcial':'⏳ Pendente';
    return `<div class="envio-item">
      <div class="envio-top">
        <div class="envio-cliente">${e.cliente||'—'}</div>
        <div class="envio-valor">${brl(e.total)}</div>
      </div>
      <div class="envio-data">📅 ${dataFmt}</div>
      <span class="envio-status ${st}">${stLabel}</span>
      <div class="envio-prods">🌱 ${prods}</div>
    </div>`;
  }).join('');
}

function setPeriodo(p){
  periodo = p;
  ['mes','mesant','ano','tudo'].forEach(x=>{
    document.getElementById('p'+x.charAt(0).toUpperCase()+x.slice(1))?.classList.remove('ativo');
  });
  document.getElementById('pMes').classList.toggle('ativo',p==='mes');
  document.getElementById('pMesAnt').classList.toggle('ativo',p==='mesant');
  document.getElementById('pAno').classList.toggle('ativo',p==='ano');
  document.getElementById('pTudo').classList.toggle('ativo',p==='tudo');
  renderizar();
}

if(sessionStorage.getItem('socio_ok')==='1'){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  iniciarApp();
}
</script>
</body>
</html>
